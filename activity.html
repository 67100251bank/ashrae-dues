<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สถานะการเงิน · ชมรม ASHRAE</title>
<link rel="icon" href="assets/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F2F7F7;
    --surface: #FFFFFF;
    --ink: #16262B;
    --ink-muted: #587076;
    --line: #D7E5E5;
    --accent: #0E7A81;
    --shadow: 0 1px 2px rgba(16, 40, 44, 0.06), 0 8px 24px -12px rgba(16, 40, 44, 0.18);
    color-scheme: light dark;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0A1416;
      --surface: #101C1F;
      --ink: #E7F2F2;
      --ink-muted: #8FA9AC;
      --line: #22363A;
      --accent: #3FD1C6;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 28px -12px rgba(0, 0, 0, 0.55);
    }
  }

  :root[data-theme="dark"] {
    --bg: #0A1416;
    --surface: #101C1F;
    --ink: #E7F2F2;
    --ink-muted: #8FA9AC;
    --line: #22363A;
    --accent: #3FD1C6;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 28px -12px rgba(0, 0, 0, 0.55);
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Sarabun", "IBM Plex Sans Thai", system-ui, sans-serif;
    line-height: 1.55;
    margin: 0;
  }

  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 28px 20px 64px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
  }

  h1 {
    font-family: "Kanit", sans-serif;
    font-weight: 700;
    font-size: 22px;
    margin: 2px 0 0;
    text-wrap: balance;
  }

  .empty {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 40px 20px;
    text-align: center;
    color: var(--ink-muted);
    font-size: 14px;
  }

  a.back {
    font-size: 13px;
    color: var(--ink-muted);
    text-decoration: none;
  }

  a.back:hover, a.back:focus-visible { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow">ชมรม ASHRAE · มหาวิทยาลัยพะเยา</span>
    <h1 id="title">สถานะการเงิน</h1>
  </header>

  <div class="empty">ยังไม่มีข้อมูลการชำระเงินสำหรับกิจกรรมนี้<br>ฝ่ายการเงินจะอัปเดตเมื่อมีข้อมูล</div>

  <a class="back" href="topics.html">← กลับไปเลือกกิจกรรม</a>
</div>

<script>
  var params = new URLSearchParams(location.search);
  var name = params.get('name');
  if (name) {
    document.getElementById('title').textContent = 'สถานะการเงิน: ' + name;
    document.title = name + ' · ชมรม ASHRAE';
  }
</script>
</body>
</html>
