<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ชมรม ASHRAE</title>
<link rel="icon" href="assets/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Sarabun:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F2F7F7;
    --surface: #FFFFFF;
    --ink: #16262B;
    --ink-muted: #587076;
    --line: #D7E5E5;
    --accent: #0E7A81;
    --accent-strong: #0A5C62;
    --accent-ink: #F4FBFB;
    color-scheme: light dark;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0A1416;
      --surface: #101C1F;
      --ink: #E7F2F2;
      --ink-muted: #8FA9AC;
      --line: #22363A;
      --accent: #3FD1C6;
      --accent-strong: #6EE0D6;
      --accent-ink: #04211F;
    }
  }

  :root[data-theme="dark"] {
    --bg: #0A1416;
    --surface: #101C1F;
    --ink: #E7F2F2;
    --ink-muted: #8FA9AC;
    --line: #22363A;
    --accent: #3FD1C6;
    --accent-strong: #6EE0D6;
    --accent-ink: #04211F;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Sarabun", "IBM Plex Sans Thai", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  main {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 22px;
  }

  .badge {
    width: 96px;
    height: 96px;
    border-radius: 22px;
    background: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 28px -12px rgba(14, 122, 129, 0.4);
    padding: 12px;
  }

  .badge img { width: 100%; height: 100%; object-fit: contain; }

  .eyebrow {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
  }

  h1 {
    font-family: "Kanit", sans-serif;
    font-weight: 700;
    font-size: 28px;
    margin: 0;
    text-wrap: balance;
  }

  p.lead {
    margin: 0;
    color: var(--ink-muted);
    font-size: 15px;
    line-height: 1.6;
    max-width: 30ch;
  }

  a.enter {
    font-family: "Kanit", sans-serif;
    font-weight: 600;
    font-size: 16px;
    text-decoration: none;
    color: var(--accent-ink);
    background: var(--accent);
    padding: 14px 32px;
    border-radius: 12px;
    box-shadow: 0 8px 20px -10px rgba(14, 122, 129, 0.6);
  }

  a.enter:focus-visible {
    outline: 2px solid var(--accent-strong);
    outline-offset: 3px;
  }

  footer {
    font-size: 12px;
    color: var(--ink-muted);
  }

  a.back {
    font-size: 13px;
    color: var(--ink-muted);
    text-decoration: none;
  }

  a.back:hover, a.back:focus-visible {
    color: var(--accent);
  }
</style>
</head>
<body>
<main>
  <div class="badge">
    <img src="assets/logo.jpg" alt="โลโก้ชมรม ASHRAE University of Phayao">
  </div>
  <span class="eyebrow">ชมรม ASHRAE · มหาวิทยาลัยพะเยา</span>
  <h1>ตรวจสอบสถานะการโอนเงิน</h1>
  <p class="lead">ดูรายชื่อสมาชิกและยอดเงินที่โอนเข้าชมรมได้ที่นี่</p>
  <a class="enter" href="dashboard.html">ดูสถานะเงิน</a>
  <a class="back" href="index.html">← ย้อนกลับ</a>
  <footer>ข้อมูลอัปเดตเป็นระยะโดยฝ่ายการเงินชมรม</footer>
</main>
</body>
</html>
