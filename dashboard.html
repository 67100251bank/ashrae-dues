<style>
  :root {
    --bg: #F2F7F7;
    --surface: #FFFFFF;
    --surface-2: #E7F0F0;
    --ink: #16262B;
    --ink-muted: #587076;
    --line: #D7E5E5;
    --accent: #0E7A81;
    --accent-strong: #0A5C62;
    --accent-ink: #F4FBFB;
    --good: #2E8B57;
    --good-bg: #E1F3E9;
    --warn: #B4650A;
    --warn-bg: #FBEADA;
    --shadow: 0 1px 2px rgba(16, 40, 44, 0.06), 0 8px 24px -12px rgba(16, 40, 44, 0.18);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0A1416;
      --surface: #101C1F;
      --surface-2: #152327;
      --ink: #E7F2F2;
      --ink-muted: #8FA9AC;
      --line: #22363A;
      --accent: #3FD1C6;
      --accent-strong: #6EE0D6;
      --accent-ink: #04211F;
      --good: #52D488;
      --good-bg: rgba(82, 212, 136, 0.12);
      --warn: #F5A524;
      --warn-bg: rgba(245, 165, 36, 0.13);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 28px -12px rgba(0, 0, 0, 0.55);
    }
  }

  :root[data-theme="dark"] {
    --bg: #0A1416;
    --surface: #101C1F;
    --surface-2: #152327;
    --ink: #E7F2F2;
    --ink-muted: #8FA9AC;
    --line: #22363A;
    --accent: #3FD1C6;
    --accent-strong: #6EE0D6;
    --accent-ink: #04211F;
    --good: #52D488;
    --good-bg: rgba(82, 212, 136, 0.12);
    --warn: #F5A524;
    --warn-bg: rgba(245, 165, 36, 0.13);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 28px -12px rgba(0, 0, 0, 0.55);
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Sarabun", "IBM Plex Sans Thai", system-ui, sans-serif;
    line-height: 1.55;
  }

  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 28px 20px 64px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  header {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding-top: 8px;
  }

  .eyebrow {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
  }

  h1 {
    font-family: "Kanit", sans-serif;
    font-weight: 700;
    font-size: 26px;
    margin: 2px 0 0;
    text-wrap: balance;
  }

  .updated {
    font-size: 13px;
    color: var(--ink-muted);
  }

  .hero {
    background: linear-gradient(160deg, var(--accent-strong), var(--accent));
    color: var(--accent-ink);
    border-radius: 20px;
    padding: 26px 24px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .hero-label {
    font-size: 13px;
    opacity: 0.85;
    font-weight: 500;
  }

  .hero-amount {
    font-family: "IBM Plex Mono", monospace;
    font-variant-numeric: tabular-nums;
    font-size: 44px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .hero-amount small {
    font-size: 18px;
    font-weight: 500;
    margin-left: 6px;
    opacity: 0.85;
  }

  .hero-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .hero-stat {
    background: rgba(255, 255, 255, 0.14);
    border-radius: 12px;
    padding: 10px 12px;
  }

  .hero-stat .n {
    font-family: "IBM Plex Mono", monospace;
    font-variant-numeric: tabular-nums;
    font-size: 20px;
    font-weight: 600;
    display: block;
  }

  .hero-stat .l {
    font-size: 12px;
    opacity: 0.85;
  }

  .controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  .search {
    flex: 1 1 200px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 14px;
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
  }

  .search:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .tabs {
    display: flex;
    gap: 6px;
  }

  .tab {
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    padding: 9px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-muted);
    cursor: pointer;
  }

  .tab[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }

  .tab:focus-visible, .search:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  ul.list {
    list-style: none;
    margin: 0;
    padding: 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }

  li.row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 13px 16px;
    border-bottom: 1px solid var(--line);
  }

  li.row:last-child { border-bottom: none; }

  .who {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }

  .who .name {
    font-weight: 500;
    font-size: 15px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .who .note {
    font-size: 12px;
    color: var(--warn);
  }

  .right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .amount {
    font-family: "IBM Plex Mono", monospace;
    font-variant-numeric: tabular-nums;
    font-size: 14px;
    font-weight: 500;
    min-width: 68px;
    text-align: right;
  }

  .pill {
    font-size: 11px;
    font-weight: 600;
    padding: 4px 9px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .pill.paid { background: var(--good-bg); color: var(--good); }
  .pill.flag { background: var(--warn-bg); color: var(--warn); }

  .empty {
    padding: 32px 16px;
    text-align: center;
    color: var(--ink-muted);
    font-size: 14px;
  }

  footer {
    font-size: 12px;
    color: var(--ink-muted);
    text-align: center;
    padding-top: 4px;
  }

  @media (prefers-reduced-motion: no-preference) {
    li.row { transition: background 0.15s ease; }
  }
</style>

<script>
(function () {
  var records = JSON.parse(document.getElementById('data').textContent);
  var fmt = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  var total = records.length;
  var paid = records.filter(function (r) { return typeof r.amount === 'number'; });
  var flagged = records.filter(function (r) { return typeof r.amount !== 'number'; });
  var sum = paid.reduce(function (a, r) { return a + r.amount; }, 0);

  document.getElementById('heroAmount').innerHTML = fmt.format(sum) + '<small>บาท</small>';
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statPaid').textContent = paid.length;
  document.getElementById('statFlag').textContent = flagged.length;

  var now = new Date();
  document.getElementById('updated').textContent = 'อัปเดตล่าสุด ' + now.toLocaleDateString('th-TH', { day: 'numeric', month: 'long', year: 'numeric' });

  var listEl = document.getElementById('list');
  var searchEl = document.getElementById('search');
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  var currentFilter = 'all';

  function render() {
    var q = searchEl.value.trim().toLowerCase();
    var rows = records.filter(function (r) {
      var matchesFilter =
        currentFilter === 'all' ||
        (currentFilter === 'paid' && typeof r.amount === 'number') ||
        (currentFilter === 'flag' && typeof r.amount !== 'number');
      var matchesSearch = !q || r.name.toLowerCase().indexOf(q) !== -1;
      return matchesFilter && matchesSearch;
    });

    listEl.innerHTML = '';

    if (rows.length === 0) {
      var empty = document.createElement('li');
      empty.className = 'empty';
      empty.textContent = 'ไม่พบรายชื่อที่ค้นหา';
      listEl.appendChild(empty);
      return;
    }

    rows.forEach(function (r) {
      var li = document.createElement('li');
      li.className = 'row';

      var who = document.createElement('div');
      who.className = 'who';
      var name = document.createElement('span');
      name.className = 'name';
      name.textContent = r.name;
      who.appendChild(name);
      if (r.note) {
        var note = document.createElement('span');
        note.className = 'note';
        note.textContent = r.note;
        who.appendChild(note);
      }

      var right = document.createElement('div');
      right.className = 'right';

      if (typeof r.amount === 'number') {
        var amt = document.createElement('span');
        amt.className = 'amount';
        amt.textContent = fmt.format(r.amount);
        var pill = document.createElement('span');
        pill.className = 'pill paid';
        pill.textContent = 'จ่ายแล้ว';
        right.appendChild(amt);
        right.appendChild(pill);
      } else {
        var pillFlag = document.createElement('span');
        pillFlag.className = 'pill flag';
        pillFlag.textContent = 'ตรวจสอบ';
        right.appendChild(pillFlag);
      }

      li.appendChild(who);
      li.appendChild(right);
      listEl.appendChild(li);
    });
  }

  searchEl.addEventListener('input', render);
  tabs.forEach(function (tab) {
    tab.addEventListener('click', function () {
      tabs.forEach(function (t) { t.setAttribute('aria-pressed', 'false'); });
      tab.setAttribute('aria-pressed', 'true');
      currentFilter = tab.getAttribute('data-filter');
      render();
    });
  });

  render();
})();
</script>
