<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เกี่ยวกับชมรม ASHRAE</title>
<link rel="icon" href="assets/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Sarabun:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F2F7F7;
    --surface: #FFFFFF;
    --ink: #16262B;
    --ink-muted: #587076;
    --line: #D7E5E5;
    --accent: #0E7A81;
    --accent-strong: #0A5C62;
    --accent-ink: #F4FBFB;
    --shadow: 0 1px 2px rgba(16, 40, 44, 0.06), 0 8px 24px -12px rgba(16, 40, 44, 0.18);
    color-scheme: light dark;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0A1416;
      --surface: #101C1F;
      --ink: #E7F2F2;
      --ink-muted: #8FA9AC;
      --line: #22363A;
      --accent: #3FD1C6;
      --accent-strong: #6EE0D6;
      --accent-ink: #04211F;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 28px -12px rgba(0, 0, 0, 0.55);
    }
  }

  :root[data-theme="dark"] {
    --bg: #0A1416;
    --surface: #101C1F;
    --ink: #E7F2F2;
    --ink-muted: #8FA9AC;
    --line: #22363A;
    --accent: #3FD1C6;
    --accent-strong: #6EE0D6;
    --accent-ink: #04211F;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 28px -12px rgba(0, 0, 0, 0.55);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Sarabun", "IBM Plex Sans Thai", system-ui, sans-serif;
    line-height: 1.65;
  }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 40px 20px 56px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .badge {
    width: 76px;
    height: 76px;
    border-radius: 18px;
    background: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow);
    padding: 10px;
  }

  .badge img { width: 100%; height: 100%; object-fit: contain; }

  .eyebrow {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
  }

  h1 {
    font-family: "Kanit", sans-serif;
    font-weight: 700;
    font-size: 30px;
    margin: 2px 0 0;
    text-wrap: balance;
  }

  a.enter {
    align-self: flex-start;
    font-family: "Kanit", sans-serif;
    font-weight: 600;
    font-size: 16px;
    text-decoration: none;
    color: var(--accent-ink);
    background: var(--accent);
    padding: 14px 32px;
    border-radius: 12px;
    box-shadow: 0 8px 20px -10px rgba(14, 122, 129, 0.6);
    margin-top: 6px;
  }

  a.enter:focus-visible {
    outline: 2px solid var(--accent-strong);
    outline-offset: 3px;
  }

  footer {
    font-size: 12px;
    color: var(--ink-muted);
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="badge">
    <img src="assets/logo.jpg" alt="โลโก้ชมรม ASHRAE University of Phayao">
  </div>

  <div>
    <span class="eyebrow">Student Chapter · มหาวิทยาลัยพะเยา</span>
    <h1>ชมรม ASHRAE</h1>
  </div>

  <a class="enter" href="welcome.html">เข้าสู่ระบบชมรม</a>
  <footer>ดูแลข้อมูลโดยฝ่ายการเงินชมรม ASHRAE</footer>
</div>
</body>
</html>
